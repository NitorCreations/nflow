plugins {
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'de.undercouch.download' version '5.6.0'
	id 'java'
}

group = 'io.nflow.springboot.fullstack.maven'
version = '0.0.1-SNAPSHOT'

java {
	sourceCompatibility = JavaVersion.VERSION_25
}

repositories {
	mavenLocal()
	mavenCentral()
	maven {
        url "https://oss.sonatype.org/content/repositories/snapshots"
    }
}

configurations {
  nflowExplorer
}

dependencies {
	implementation 'io.nflow:nflow-rest-api-spring-web:10.0.2'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	runtimeOnly 'com.h2database:h2:2.4.240'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	nflowExplorer group: 'io.nflow', name: 'nflow-explorer', version: '10.0.2', ext: 'tar.gz'
}

task resolveNflowExplorer(type: Copy) {
  into layout.buildDirectory.dir("resources/main/static/explorer")
  from { tarTree(resources.gzip(configurations.nflowExplorer.singleFile)) }
}

test {
	useJUnitPlatform()
}

processResources.dependsOn resolveNflowExplorer
